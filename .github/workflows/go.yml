name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

    - name: Known vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
